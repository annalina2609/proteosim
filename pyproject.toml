[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "proteosim"
version = "0.1.0"
description = "The purpose of this package is to simulate a complete in silico proteomics workflow. It provides a set of functions that can be applied to a protein set to model fragmentation, liquid chromatography, ionization, and the resulting MS1 and MS2 spectra. This code is under active development."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Annalina Baumüller annalina@baumuellers.de" }]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "pyteomics"
]

[tool.setuptools.packages.find]
include = ["proteosim*"]
